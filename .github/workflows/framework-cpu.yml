name: Framework CPU qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  framework:
    name: Linux CPU ${{ matrix.framework }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [verl, trl]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: false
      - name: Install pinned CPU framework and built wheel
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python 3.12 "$RUNNER_TEMP/framework-env"
          task_python="$RUNNER_TEMP/framework-env/bin/python"
          uv pip sync --python "$task_python" \
            --index https://download.pytorch.org/whl/cpu \
            --default-index https://pypi.org/simple \
            --index-strategy unsafe-best-match \
            ".github/framework-requirements/${{ matrix.framework }}-cpu.txt"
          uv build --wheel --out-dir "$RUNNER_TEMP/wheels"
          uv pip install --python "$task_python" --no-deps "$RUNNER_TEMP/wheels/rlreplay-0.1.0-py3-none-any.whl"
          uv pip check --python "$task_python"
      - name: Qualify real framework boundary and injected controls
        shell: bash
        run: >-
          "$RUNNER_TEMP/framework-env/bin/python"
          .github/scripts/framework_qualification.py
          --framework "${{ matrix.framework }}"
          --output "$RUNNER_TEMP/qualification"
      - name: Preserve qualification diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: framework-cpu-${{ matrix.framework }}
          path: |
            ${{ runner.temp }}/qualification/*.log
            ${{ runner.temp }}/qualification/summary.json
          if-no-files-found: warn
